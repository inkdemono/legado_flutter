<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS源导入 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #24160a, #111827 62%);
        }
        .phone-frame {
            width: 375px; height: 812px; border-radius: 40px; overflow: hidden; position: relative;
            background:
                linear-gradient(180deg, rgba(0,0,0,0.34), rgba(0,0,0,0.54)),
                linear-gradient(135deg, #fff4e8, #f2e3d3);
            box-shadow: 0 26px 60px rgba(0,0,0,0.34);
        }
        .sheet {
            position: absolute; left: 10px; right: 10px; bottom: 10px; top: 120px; background: rgba(255,255,255,0.95);
            backdrop-filter: blur(16px); border-radius: 30px; padding: 14px 16px 18px;
        }
        .handle { width: 42px; height: 5px; border-radius: 999px; background: #d8cfc6; margin: 0 auto 14px; }
        .title { font-size: 20px; font-weight: 800; color: #1f2329; text-align: center; }
        .sub { margin-top: 6px; font-size: 13px; color: #86909c; text-align: center; line-height: 1.5; }
        .alert {
            margin-top: 16px; padding: 12px 14px; border-radius: 18px; background: #fff2f0; color: #e34d59; font-size: 13px;
        }
        .textarea {
            margin-top: 14px; min-height: 160px; padding: 14px; border-radius: 20px; background: #f7f8fa; border: 1px solid #edf0f4;
            color: #b8bec8; font-size: 14px; line-height: 1.6;
        }
        .upload {
            margin-top: 14px; height: 50px; border-radius: 18px; background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa;
            display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
        }
        .footer { position: absolute; left: 16px; right: 16px; bottom: 18px; display: flex; gap: 10px; }
        .btn {
            height: 50px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
        }
        .btn.ghost { flex: 1; background: #fff; color: #4e5969; border: 1px solid #edf0f4; }
        .btn.primary { flex: 1.2; background: linear-gradient(135deg, #fb923c, #ea580c); color: #fff; }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>RSS源导入</h1>
            <p>补充“发现”模块里的 RSS 导入弹层，同时容纳 URL、JSON 粘贴和本地文件导入入口。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="sheet">
                    <div class="handle"></div>
                    <div class="title">导入RSS源</div>
                    <div class="sub">支持直接输入 URL，或粘贴 JSON，也可以从本地文件导入。设计上把失败提示放在输入区上方。</div>
                    <div class="alert">导入失败：未识别到有效的 RSS 源格式，请检查 JSON 结构或链接内容。</div>
                    <div class="textarea">输入 RSS 源 URL 或粘贴 JSON 内容…</div>
                    <div class="upload">从本地文件导入</div>
                    <div class="footer">
                        <div class="btn ghost">取消</div>
                        <div class="btn primary">导入</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
