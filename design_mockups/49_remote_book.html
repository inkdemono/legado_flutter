<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程书籍 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f7f9fc;
            --card: #ffffff;
            --text: #1f2329;
            --sub: #4e5969;
            --hint: #86909c;
            --line: #e5e6eb;
            --primary: #1677ff;
            --green: #16a34a;
        }
        body { background: linear-gradient(135deg, #101a25, #17314d 60%, #0f172a); }
        .phone-frame {
            background:
                radial-gradient(circle at top, rgba(22,119,255,0.12), transparent 32%),
                linear-gradient(180deg, #fbfdff, var(--bg));
        }
        .status-bar, .app-bar { display: flex; align-items: center; background: rgba(255,255,255,0.95); }
        .status-bar {
            height: 44px; justify-content: space-between; padding: 10px 24px 0;
            font-size: 14px; font-weight: 600; color: var(--text);
        }
        .app-bar {
            height: 56px; padding: 0 12px; border-bottom: 1px solid var(--line);
        }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text);
        }
        .app-bar-title { flex: 1; font-size: 18px; font-weight: 700; color: var(--text); }
        .toolbar {
            padding: 12px 16px 10px; background: rgba(255,255,255,0.92); border-bottom: 1px solid var(--line);
        }
        .path {
            padding: 10px 12px; border-radius: 16px; background: #eef6ff; color: var(--primary); font-size: 12px; font-weight: 700;
        }
        .config-card {
            margin-top: 10px; padding: 12px; border-radius: 18px; background: #f7f9fc; border: 1px solid #edf0f4;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .config-main { font-size: 14px; font-weight: 800; color: var(--text); }
        .config-sub { margin-top: 4px; font-size: 12px; color: var(--sub); }
        .config-state {
            padding: 6px 10px; border-radius: 999px; background: #eefbf3; color: var(--green); font-size: 11px; font-weight: 700;
        }
        .content-area {
            height: calc(100% - 44px - 56px - 116px - 86px);
            overflow-y: auto; padding: 12px 16px 0;
        }
        .row {
            display: flex; align-items: center; gap: 12px; padding: 14px; margin-bottom: 10px; border-radius: 20px;
            background: var(--card); box-shadow: 0 8px 20px rgba(15,23,32,0.05);
        }
        .row-icon {
            width: 46px; height: 46px; border-radius: 16px; flex-shrink: 0;
            background: #eef6ff; color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .row-icon.file { background: #fff4e8; color: #ea580c; }
        .info { flex: 1; min-width: 0; }
        .title { font-size: 15px; font-weight: 800; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sub { margin-top: 4px; font-size: 12px; color: var(--sub); }
        .check {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c9cdd4; flex-shrink: 0;
        }
        .check.active { background: var(--primary); border-color: var(--primary); box-shadow: inset 0 0 0 4px #fff; }
        .bottom-bar {
            position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 24px;
            background: rgba(255,255,255,0.96); border-top: 1px solid var(--line);
        }
        .actions { display: flex; gap: 10px; }
        .btn {
            flex: 1; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700;
        }
        .btn.ghost { background: #f2f3f5; color: var(--sub); }
        .btn.primary { background: linear-gradient(135deg, #1677ff, #69b1ff); color: #fff; }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>远程书籍</h1>
            <p>补充“书架”模块里的远程书籍弹层，串起 WebDAV 配置、目录浏览、多选下载和加入书架动作。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="status-bar"><span>9:41</span><span>Wi-Fi 100%</span></div>
                <div class="app-bar">
                    <div class="icon-btn">‹</div>
                    <div class="app-bar-title">远程书籍</div>
                    <div class="icon-btn">⚙</div>
                </div>
                <div class="toolbar">
                    <div class="path">/webdav/books/scifi</div>
                    <div class="config-card">
                        <div>
                            <div class="config-main">WebDAV 已连接</div>
                            <div class="config-sub">cloud.example.com · 支持目录浏览与批量下载</div>
                        </div>
                        <div class="config-state">已配置</div>
                    </div>
                </div>
                <div class="content-area">
                    <div class="row">
                        <div class="row-icon">📁</div>
                        <div class="info">
                            <div class="title">2026 新书</div>
                            <div class="sub">文件夹 · 14 项</div>
                        </div>
                        <div class="icon-btn">›</div>
                    </div>

                    <div class="row">
                        <div class="check active"></div>
                        <div class="row-icon file">📘</div>
                        <div class="info">
                            <div class="title">三体.epub</div>
                            <div class="sub">1.8 MB · EPUB</div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="check active"></div>
                        <div class="row-icon file">📗</div>
                        <div class="info">
                            <div class="title">沙丘.txt</div>
                            <div class="sub">942 KB · TXT</div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="check"></div>
                        <div class="row-icon file">📙</div>
                        <div class="info">
                            <div class="title">银河帝国合集.epub</div>
                            <div class="sub">4.2 MB · EPUB</div>
                        </div>
                    </div>
                </div>
                <div class="bottom-bar">
                    <div class="actions">
                        <div class="btn ghost">刷新目录</div>
                        <div class="btn primary">添加 2 本到书架</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
