<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频库 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #07111d, #111827 62%);
        }
        .phone-frame {
            width: 375px; height: 812px; border-radius: 40px; overflow: hidden; position: relative;
            background:
                radial-gradient(circle at top right, rgba(56,189,248,0.14), transparent 24%),
                linear-gradient(180deg, #f7fbff, #f1f5f9 220px, #f6f7fb);
            box-shadow: 0 26px 60px rgba(0,0,0,0.34);
        }
        .hero { padding: 18px 16px 12px; }
        .hero-card {
            padding: 18px; border-radius: 26px; color: #fff;
            background: linear-gradient(135deg, #0ea5e9, #2563eb 58%, #312e81);
            box-shadow: 0 18px 32px rgba(37,99,235,0.18);
        }
        .hero-title { font-size: 24px; font-weight: 800; }
        .hero-sub { font-size: 13px; color: rgba(255,255,255,0.82); margin-top: 8px; line-height: 1.5; }
        .tab-strip { padding: 0 16px 12px; display: flex; gap: 8px; }
        .tab { padding: 8px 14px; border-radius: 999px; background: #e0f2fe; color: #0369a1; font-size: 12px; }
        .tab.active { background: #0369a1; color: #fff; font-weight: 700; }
        .content-area {
            height: calc(100% - 44px - 144px - 50px);
            overflow-y: auto; padding: 0 16px 20px;
        }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .video-card {
            border-radius: 22px; overflow: hidden; background: #fff; box-shadow: 0 10px 24px rgba(15,23,32,0.06);
        }
        .thumb {
            aspect-ratio: 16 / 10; position: relative;
            background: linear-gradient(135deg, #0ea5e9, #312e81);
        }
        .thumb.t2 { background: linear-gradient(135deg, #fb7185, #7c3aed); }
        .thumb.t3 { background: linear-gradient(135deg, #34d399, #0f766e); }
        .thumb.t4 { background: linear-gradient(135deg, #f59e0b, #ef4444); }
        .thumb::before {
            content: "▶"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.18);
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px;
        }
        .badge {
            position: absolute; top: 10px; left: 10px; padding: 4px 8px; border-radius: 999px;
            background: rgba(255,255,255,0.18); color: #fff; font-size: 11px;
        }
        .duration {
            position: absolute; right: 10px; bottom: 10px; padding: 4px 6px; border-radius: 8px;
            background: rgba(0,0,0,0.52); color: #fff; font-size: 11px;
        }
        .progress {
            position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.18);
        }
        .progress-fill { width: 38%; height: 100%; background: #38bdf8; }
        .video-body { padding: 12px; }
        .video-title { font-size: 14px; font-weight: 700; color: #1f2329; line-height: 1.45; min-height: 40px; }
        .video-meta { margin-top: 6px; font-size: 12px; color: #86909c; }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>视频库</h1>
            <p>补充“媒体”模块的视频库页面，强调网格缩略图、观看进度和本地/历史标签的区别。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="status-bar"><span>9:41</span><span>5G 100%</span></div>
                <div class="hero">
                    <div class="hero-card">
                        <div class="hero-title">Video</div>
                        <div class="hero-sub">视频库更依赖缩略图扫描，因此用高比例的网格视图承载主入口，观看历史则切到横向信息卡。</div>
                    </div>
                </div>
                <div class="tab-strip">
                    <div class="tab active">全部</div>
                    <div class="tab">本地</div>
                    <div class="tab">历史</div>
                </div>
                <div class="content-area">
                    <div class="grid">
                        <div class="video-card">
                            <div class="thumb">
                                <div class="badge">本地</div>
                                <div class="duration">24:18</div>
                                <div class="progress"><div class="progress-fill"></div></div>
                            </div>
                            <div class="video-body">
                                <div class="video-title">Planet Earth II</div>
                                <div class="video-meta">已看 38% · UHD</div>
                            </div>
                        </div>
                        <div class="video-card">
                            <div class="thumb t2">
                                <div class="duration">18:06</div>
                            </div>
                            <div class="video-body">
                                <div class="video-title">宇宙探索编辑精选</div>
                                <div class="video-meta">网络视频 · 1080P</div>
                            </div>
                        </div>
                        <div class="video-card">
                            <div class="thumb t3">
                                <div class="badge">本地</div>
                                <div class="duration">42:51</div>
                            </div>
                            <div class="video-body">
                                <div class="video-title">Flutter Europe 2025</div>
                                <div class="video-meta">开发大会</div>
                            </div>
                        </div>
                        <div class="video-card">
                            <div class="thumb t4">
                                <div class="duration">09:32</div>
                            </div>
                            <div class="video-body">
                                <div class="video-title">短片：The Last Library</div>
                                <div class="video-meta">历史记录 · 已看完</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
