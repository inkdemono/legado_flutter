<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS源管理 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #3d1807, #111827 62%);
        }
        .phone-frame {
            width: 375px; height: 812px; border-radius: 40px; overflow: hidden; position: relative; background: #f6f7fb;
            box-shadow: 0 26px 60px rgba(0,0,0,0.34);
        }
        .status-bar, .app-bar, .search-wrap { background: #fff; display: flex; align-items: center; }
        .status-bar { height: 44px; justify-content: space-between; padding: 10px 24px 0; font-size: 14px; font-weight: 600; color: #1f2329; }
        .app-bar { height: 56px; padding: 0 12px; border-bottom: 1px solid #e5e6eb; }
        .icon-btn { width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #4e5969; }
        .app-bar-title { flex: 1; font-size: 18px; font-weight: 700; color: #1f2329; }
        .search-wrap { padding: 10px 16px 12px; border-bottom: 1px solid #e5e6eb; }
        .search-box {
            width: 100%; height: 42px; border-radius: 16px; background: #f7f8fa; border: 1px solid #edf0f4;
            display: flex; align-items: center; padding: 0 14px; color: #86909c; font-size: 14px;
        }
        .batch-bar {
            padding: 12px 16px; background: #fff7ed; color: #c2410c; display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid #fed7aa; font-size: 13px;
        }
        .batch-count { font-weight: 700; color: #9a3412; }
        .batch-link { margin-left: auto; }
        .content-area {
            height: calc(100% - 44px - 56px - 65px - 47px);
            overflow-y: auto; padding: 12px 12px 24px;
            background: linear-gradient(180deg, #fcfcfd, #f6f7fb);
        }
        .source-card {
            display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 20px; background: #fff;
            margin-bottom: 10px; box-shadow: 0 8px 20px rgba(15,23,32,0.05);
        }
        .check {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fdba74; background: #fff7ed; flex-shrink: 0; margin-top: 8px;
        }
        .feed-icon {
            width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(135deg, #fb923c, #ea580c);
            color: #fff; display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0;
        }
        .source-info { flex: 1; min-width: 0; }
        .source-title { font-size: 15px; font-weight: 700; color: #1f2329; }
        .source-meta { margin-top: 4px; font-size: 12px; color: #86909c; }
        .source-url { margin-top: 8px; font-size: 12px; color: #4e5969; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .source-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .tag { padding: 4px 8px; border-radius: 999px; background: #fff7ed; color: #c2410c; font-size: 11px; }
        .switch {
            width: 44px; height: 26px; border-radius: 13px; background: rgba(34,197,94,0.28); position: relative; flex-shrink: 0; margin-top: 8px;
        }
        .switch::after {
            content: ""; position: absolute; top: 3px; left: 21px; width: 20px; height: 20px; border-radius: 50%; background: #22c55e;
        }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>RSS源管理</h1>
            <p>补充“发现”模块中 RSS 源管理页，覆盖搜索、批量模式、启用状态和分组信息。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="status-bar"><span>9:41</span><span>5G 100%</span></div>
                <div class="app-bar">
                    <div class="icon-btn">‹</div>
                    <div class="app-bar-title">RSS源管理</div>
                    <div class="icon-btn">＋</div>
                    <div class="icon-btn">⇪</div>
                    <div class="icon-btn">☰</div>
                </div>
                <div class="search-wrap">
                    <div class="search-box">⌕ 搜索 RSS 源</div>
                </div>
                <div class="batch-bar">
                    <span class="batch-count">已选择 2 项</span>
                    <span>启用</span>
                    <span>禁用</span>
                    <span class="batch-link">删除</span>
                </div>
                <div class="content-area">
                    <div class="source-card">
                        <div class="check"></div>
                        <div class="feed-icon">RSS</div>
                        <div class="source-info">
                            <div class="source-title">少数派</div>
                            <div class="source-meta">分组：科技资讯</div>
                            <div class="source-url">https://sspai.com/feed</div>
                            <div class="source-tags">
                                <span class="tag">启用</span>
                                <span class="tag">排序 01</span>
                            </div>
                        </div>
                        <div class="switch"></div>
                    </div>

                    <div class="source-card">
                        <div class="check"></div>
                        <div class="feed-icon">📰</div>
                        <div class="source-info">
                            <div class="source-title">阮一峰网络日志</div>
                            <div class="source-meta">分组：开发</div>
                            <div class="source-url">https://www.ruanyifeng.com/blog/atom.xml</div>
                            <div class="source-tags">
                                <span class="tag">启用</span>
                                <span class="tag">单源</span>
                            </div>
                        </div>
                        <div class="switch"></div>
                    </div>

                    <div class="source-card">
                        <div class="check" style="border-color:#d0d7e2;background:#fff;"></div>
                        <div class="feed-icon">✦</div>
                        <div class="source-info">
                            <div class="source-title">The Verge</div>
                            <div class="source-meta">分组：英文资讯</div>
                            <div class="source-url">https://www.theverge.com/rss/index.xml</div>
                            <div class="source-tags">
                                <span class="tag">未启用</span>
                            </div>
                        </div>
                        <div class="switch" style="background:#e5e6eb;"><span style="display:none"></span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
