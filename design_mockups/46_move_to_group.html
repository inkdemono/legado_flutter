<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移动到分组 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --text: #1f2329;
            --sub: #4e5969;
            --hint: #86909c;
            --line: #e5e6eb;
            --primary: #165dff;
        }
        body { background: linear-gradient(135deg, #101821, #203452 60%, #1f2740); }
        .phone-frame {
            background:
                radial-gradient(circle at top, rgba(22,93,255,0.18), transparent 32%),
                linear-gradient(180deg, #eef4ff, #f7f9fc);
        }
        .dialog {
            position: absolute; left: 20px; right: 20px; top: 108px;
            border-radius: 28px; overflow: hidden; background: rgba(255,255,255,0.96);
            box-shadow: 0 24px 60px rgba(17,24,39,0.18); backdrop-filter: blur(18px);
        }
        .dialog-head {
            padding: 18px; border-bottom: 1px solid var(--line);
        }
        .dialog-title { font-size: 18px; font-weight: 800; color: var(--text); }
        .dialog-sub { margin-top: 6px; font-size: 12px; color: var(--hint); }
        .group-list { padding: 12px; display: grid; gap: 10px; }
        .group-item {
            display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px;
            background: #f7f9fc; border: 1px solid #edf0f4;
        }
        .group-item.active { background: #eef4ff; border-color: #cfe0ff; }
        .group-icon {
            width: 42px; height: 42px; border-radius: 16px; flex-shrink: 0;
            background: linear-gradient(135deg, #69b1ff, #165dff); color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .group-icon.alt { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .group-icon.green { background: linear-gradient(135deg, #34d399, #059669); }
        .group-info { flex: 1; }
        .group-title { font-size: 15px; font-weight: 800; color: var(--text); }
        .group-sub { margin-top: 4px; font-size: 12px; color: var(--sub); }
        .radio {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c9cdd4; flex-shrink: 0;
        }
        .group-item.active .radio {
            border-color: var(--primary); background: var(--primary); box-shadow: inset 0 0 0 4px #fff;
        }
        .dialog-footer {
            display: flex; gap: 10px; padding: 0 16px 16px;
        }
        .btn {
            flex: 1; height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700;
        }
        .btn.ghost { background: #f2f3f5; color: var(--sub); }
        .btn.primary { background: linear-gradient(135deg, #165dff, #69b1ff); color: #fff; }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>移动到分组</h1>
            <p>补充“书架”模块里的选择分组对话框，把单本和批量移动共用成更明确的目标选择界面。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="dialog">
                    <div class="dialog-head">
                        <div class="dialog-title">选择分组</div>
                        <div class="dialog-sub">将 3 本书籍移动到新的书架分组</div>
                    </div>
                    <div class="group-list">
                        <div class="group-item active">
                            <div class="group-icon">🚀</div>
                            <div class="group-info">
                                <div class="group-title">科幻</div>
                                <div class="group-sub">12 本书 · 启用刷新</div>
                            </div>
                            <div class="radio"></div>
                        </div>

                        <div class="group-item">
                            <div class="group-icon alt">⚔</div>
                            <div class="group-info">
                                <div class="group-title">武侠</div>
                                <div class="group-sub">28 本书 · 手动排序</div>
                            </div>
                            <div class="radio"></div>
                        </div>

                        <div class="group-item">
                            <div class="group-icon green">🧠</div>
                            <div class="group-info">
                                <div class="group-title">非虚构</div>
                                <div class="group-sub">9 本书 · 自定义分组</div>
                            </div>
                            <div class="radio"></div>
                        </div>
                    </div>
                    <div class="dialog-footer">
                        <div class="btn ghost">取消</div>
                        <div class="btn primary">确认移动</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
