<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字幕音轨选择 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --text: #1f2329;
            --sub: #4e5969;
            --hint: #86909c;
            --primary: #0ea5e9;
            --accent: #14b8a6;
        }
        body { background: linear-gradient(135deg, #101821, #243b56 58%, #0f172a); }
        .phone-frame {
            background:
                linear-gradient(180deg, rgba(0,0,0,0.32), rgba(0,0,0,0.56)),
                linear-gradient(135deg, #dff4ff, #dcfce7);
        }
        .sheet {
            position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 26px;
            border-radius: 32px 32px 0 0; background: rgba(255,255,255,0.96); backdrop-filter: blur(16px);
        }
        .handle { width: 42px; height: 5px; border-radius: 999px; background: #d0d7e2; margin: 0 auto 18px; }
        .head { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab {
            flex: 1; height: 40px; border-radius: 14px; background: #f2f3f5; display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700; color: #4e5969;
        }
        .tab.active { background: #eef9ff; color: #0ea5e9; }
        .list { display: grid; gap: 10px; }
        .item {
            display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px;
            background: #f7f9fc; border: 1px solid #edf0f4;
        }
        .item.active { background: #f0fdfa; border-color: #c8f1eb; }
        .icon {
            width: 42px; height: 42px; border-radius: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 18px; background: linear-gradient(135deg, #14b8a6, #0ea5e9);
        }
        .info { flex: 1; }
        .name { font-size: 15px; font-weight: 800; color: #1f2329; }
        .desc { margin-top: 4px; font-size: 12px; color: #4e5969; }
        .check {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c9cdd4; flex-shrink: 0;
        }
        .item.active .check {
            border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 4px #fff;
        }
        .hint {
            margin-top: 14px; font-size: 12px; color: #86909c; line-height: 1.6;
        }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>字幕音轨选择</h1>
            <p>补充“媒体”模块视频播放器里的字幕与音轨选择弹层，用双 tab 承载两个相近但独立的控制维度。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="sheet">
                    <div class="handle"></div>
                    <div class="head">
                        <div class="tab active">字幕</div>
                        <div class="tab">音轨</div>
                    </div>
                    <div class="list">
                        <div class="item active">
                            <div class="icon">CC</div>
                            <div class="info">
                                <div class="name">简体中文</div>
                                <div class="desc">外挂字幕 · 推荐</div>
                            </div>
                            <div class="check"></div>
                        </div>
                        <div class="item">
                            <div class="icon">EN</div>
                            <div class="info">
                                <div class="name">English</div>
                                <div class="desc">外挂字幕 · 原文</div>
                            </div>
                            <div class="check"></div>
                        </div>
                        <div class="item">
                            <div class="icon">Ø</div>
                            <div class="info">
                                <div class="name">关闭字幕</div>
                                <div class="desc">只保留原始视频画面与音轨</div>
                            </div>
                            <div class="check"></div>
                        </div>
                    </div>
                    <div class="hint">切换到“音轨”页后，可选择原声、国语配音或评论音轨。这里将字幕和音轨保持在同一弹层，减少播放器内的层级跳转。</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
