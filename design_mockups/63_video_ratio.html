<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频画面比例 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --text: #1f2329;
            --sub: #4e5969;
            --hint: #86909c;
            --primary: #0ea5e9;
        }
        body { background: linear-gradient(135deg, #101821, #243b56 58%, #0f172a); }
        .phone-frame {
            background:
                linear-gradient(180deg, rgba(0,0,0,0.32), rgba(0,0,0,0.56)),
                linear-gradient(135deg, #dff4ff, #e2e8ff);
        }
        .sheet {
            position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 26px;
            border-radius: 32px 32px 0 0; background: rgba(255,255,255,0.96); backdrop-filter: blur(16px);
        }
        .handle { width: 42px; height: 5px; border-radius: 999px; background: #d0d7e2; margin: 0 auto 18px; }
        .title { font-size: 20px; font-weight: 800; color: #1f2329; }
        .sub { margin-top: 6px; font-size: 13px; color: #86909c; line-height: 1.6; }
        .list { margin-top: 18px; display: grid; gap: 10px; }
        .item {
            display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px;
            background: #f7f9fc; border: 1px solid #edf0f4;
        }
        .item.active { background: #eef9ff; border-color: #c9ecff; }
        .thumb {
            width: 56px; height: 40px; border-radius: 12px; border: 2px solid #cbd5e1; background: #fff; position: relative; flex-shrink: 0;
        }
        .thumb::after {
            content: ""; position: absolute; inset: 6px 10px; border-radius: 6px; background: linear-gradient(135deg, #0ea5e9, #2563eb);
        }
        .thumb.wide::after { inset: 9px 5px; }
        .thumb.fill::after { inset: 4px; }
        .info { flex: 1; }
        .name { font-size: 15px; font-weight: 800; color: #1f2329; }
        .desc { margin-top: 4px; font-size: 12px; color: #4e5969; }
        .check {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c9cdd4; flex-shrink: 0;
        }
        .item.active .check {
            border-color: var(--primary); background: var(--primary); box-shadow: inset 0 0 0 4px #fff;
        }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>视频画面比例</h1>
            <p>补充“媒体”模块视频播放器里的画面比例弹层，覆盖原始比例、适应屏幕和铺满裁切这些常用选择。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="sheet">
                    <div class="handle"></div>
                    <div class="title">画面比例</div>
                    <div class="sub">根据视频源尺寸和当前观看方式，选择更适合的画面填充策略。</div>
                    <div class="list">
                        <div class="item active">
                            <div class="thumb"></div>
                            <div class="info">
                                <div class="name">原始比例</div>
                                <div class="desc">保持视频原本长宽比，不做额外拉伸</div>
                            </div>
                            <div class="check"></div>
                        </div>
                        <div class="item">
                            <div class="thumb wide"></div>
                            <div class="info">
                                <div class="name">适应屏幕</div>
                                <div class="desc">尽量完整显示画面，允许上下或左右留黑边</div>
                            </div>
                            <div class="check"></div>
                        </div>
                        <div class="item">
                            <div class="thumb fill"></div>
                            <div class="info">
                                <div class="name">铺满屏幕</div>
                                <div class="desc">优先填满显示区域，必要时裁切边缘内容</div>
                            </div>
                            <div class="check"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
