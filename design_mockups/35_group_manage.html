<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分组管理 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #181b2c, #111827 62%);
        }
        .phone-frame {
            width: 375px; height: 812px; border-radius: 40px; overflow: hidden; position: relative;
            background:
                linear-gradient(180deg, rgba(0,0,0,0.36), rgba(0,0,0,0.54)),
                linear-gradient(135deg, #efe9ff, #dadcff);
            box-shadow: 0 26px 60px rgba(0,0,0,0.34);
        }
        .sheet {
            position: absolute; left: 10px; right: 10px; bottom: 10px; top: 80px; background: rgba(255,255,255,0.95);
            backdrop-filter: blur(16px); border-radius: 30px; padding: 14px 16px 18px;
        }
        .handle { width: 42px; height: 5px; border-radius: 999px; background: #d0d7e2; margin: 0 auto 14px; }
        .head { display: flex; align-items: center; margin-bottom: 14px; }
        .title { font-size: 20px; font-weight: 800; color: #1f2329; }
        .plus {
            margin-left: auto; width: 42px; height: 42px; border-radius: 21px; background: #f3f0ff; color: #6b4dff;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .list { display: grid; gap: 10px; }
        .group {
            display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px; background: #f8f9fc; border: 1px solid #edf0f4;
        }
        .group-icon {
            width: 40px; height: 40px; border-radius: 14px; background: linear-gradient(135deg, #7b5cff, #9c7dff);
            color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .group-info { flex: 1; }
        .group-title { font-size: 14px; font-weight: 700; color: #1f2329; }
        .group-sub { margin-top: 4px; font-size: 12px; color: #86909c; }
        .switch {
            width: 44px; height: 26px; border-radius: 13px; background: rgba(123,92,255,0.28); position: relative;
        }
        .switch::after {
            content: ""; position: absolute; top: 3px; left: 21px; width: 20px; height: 20px; border-radius: 50%; background: #7b5cff;
        }
        .actions { display: flex; gap: 4px; color: #b8bec8; font-size: 18px; }
        .footer { position: absolute; left: 16px; right: 16px; bottom: 18px; }
        .btn {
            height: 50px; border-radius: 16px; background: linear-gradient(135deg, #7b5cff, #9c7dff); color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
        }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>分组管理</h1>
            <p>补充“书架”模块里的分组管理弹层，覆盖显隐开关、编辑删除入口和新增动作。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="sheet">
                    <div class="handle"></div>
                    <div class="head">
                        <div class="title">分组管理</div>
                        <div class="plus">＋</div>
                    </div>
                    <div class="list">
                        <div class="group">
                            <div class="group-icon">📚</div>
                            <div class="group-info">
                                <div class="group-title">科幻</div>
                                <div class="group-sub">ID: 12 · 启用刷新</div>
                            </div>
                            <div class="switch"></div>
                            <div class="actions">⋯</div>
                        </div>
                        <div class="group">
                            <div class="group-icon">⚔</div>
                            <div class="group-info">
                                <div class="group-title">武侠</div>
                                <div class="group-sub">ID: 13 · 手动排序</div>
                            </div>
                            <div class="switch"></div>
                            <div class="actions">⋯</div>
                        </div>
                        <div class="group">
                            <div class="group-icon">🧠</div>
                            <div class="group-info">
                                <div class="group-title">非虚构</div>
                                <div class="group-sub">ID: 14 · 已隐藏</div>
                            </div>
                            <div class="switch" style="background:#e5e6eb;"><span style="display:none"></span></div>
                            <div class="actions">⋯</div>
                        </div>
                    </div>
                    <div class="footer">
                        <div class="btn">完成</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
