<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缓存导出 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f6f8fb;
            --card: #fff;
            --text: #1f2329;
            --sub: #4e5969;
            --hint: #86909c;
            --line: #e5e6eb;
            --primary: #1677ff;
            --accent: #7c3aed;
        }
        body { background: linear-gradient(135deg, #111b25, #1b2a46 60%, #101827); }
        .phone-frame {
            background:
                radial-gradient(circle at top, rgba(22,119,255,0.12), transparent 30%),
                linear-gradient(180deg, #fbfdff, var(--bg));
        }
        .status-bar, .app-bar { display: flex; align-items: center; background: rgba(255,255,255,0.95); }
        .status-bar {
            height: 44px; justify-content: space-between; padding: 10px 24px 0;
            font-size: 14px; font-weight: 600; color: var(--text);
        }
        .app-bar {
            height: 56px; padding: 0 12px; border-bottom: 1px solid var(--line);
        }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text);
        }
        .app-bar-title { flex: 1; font-size: 18px; font-weight: 700; color: var(--text); }
        .toolbar {
            padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line);
        }
        .search-row { display: flex; gap: 10px; }
        .search-box {
            flex: 1; height: 44px; border-radius: 16px; border: 1px solid #edf0f4; background: #f7f9fc;
            display: flex; align-items: center; padding: 0 14px; color: var(--hint); font-size: 14px;
        }
        .toggle {
            width: 44px; height: 44px; border-radius: 16px; background: #eef4ff; color: var(--primary);
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .batch-bar {
            margin: 12px 16px 0; padding: 14px; border-radius: 20px; background: linear-gradient(135deg, #eef4ff, #f7faff); border: 1px solid #d6e4ff;
        }
        .batch-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .batch-title { font-size: 15px; font-weight: 800; color: var(--text); }
        .batch-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .action {
            padding: 10px 0; border-radius: 14px; text-align: center; font-size: 12px; font-weight: 700;
            background: #fff; color: var(--sub);
        }
        .content-area {
            height: calc(100% - 44px - 56px - 68px - 84px);
            overflow-y: auto; padding: 12px 16px 18px;
        }
        .book {
            display: flex; gap: 12px; align-items: center; padding: 12px; margin-bottom: 10px; border-radius: 20px;
            background: var(--card); box-shadow: 0 8px 20px rgba(15,23,32,0.05);
        }
        .check {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c9cdd4; flex-shrink: 0;
        }
        .check.active { background: var(--primary); border-color: var(--primary); box-shadow: inset 0 0 0 4px #fff; }
        .cover {
            width: 52px; height: 74px; border-radius: 14px; flex-shrink: 0;
            background: linear-gradient(160deg, #5677f0, #2944b4);
        }
        .cover.c2 { background: linear-gradient(160deg, #8b5cf6, #6d28d9); }
        .info { flex: 1; }
        .title { font-size: 15px; font-weight: 800; color: var(--text); }
        .sub { margin-top: 4px; font-size: 12px; color: var(--sub); }
        .progress {
            margin-top: 8px; height: 8px; border-radius: 999px; background: #edf0f4; overflow: hidden;
        }
        .progress > span {
            display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #1677ff, #7c3aed);
        }
        .meta { margin-top: 6px; font-size: 11px; color: var(--hint); }
        .more { color: #b8bec8; font-size: 18px; }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>缓存导出</h1>
            <p>补充“书架”模块里的缓存与导出页，把缓存进度、筛选、多选和双动作批量栏整合到同一管理视图。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="status-bar"><span>9:41</span><span>5G 100%</span></div>
                <div class="app-bar">
                    <div class="icon-btn">‹</div>
                    <div class="app-bar-title">缓存/导出</div>
                    <div class="icon-btn">✕</div>
                </div>
                <div class="toolbar">
                    <div class="search-row">
                        <div class="search-box">⌕ 筛选 • 科幻分组</div>
                        <div class="toggle">☑</div>
                    </div>
                </div>
                <div class="batch-bar">
                    <div class="batch-top">
                        <div class="batch-title">已选择 2 项</div>
                        <div class="meta">缓存与导出可同时执行</div>
                    </div>
                    <div class="batch-actions">
                        <div class="action">缓存</div>
                        <div class="action">导出</div>
                    </div>
                </div>
                <div class="content-area">
                    <div class="book">
                        <div class="check active"></div>
                        <div class="cover"></div>
                        <div class="info">
                            <div class="title">三体</div>
                            <div class="sub">刘慈欣</div>
                            <div class="progress"><span style="width: 72%;"></span></div>
                            <div class="meta">缓存: 128 / 178 章</div>
                        </div>
                        <div class="more">⋯</div>
                    </div>
                    <div class="book">
                        <div class="check active"></div>
                        <div class="cover c2"></div>
                        <div class="info">
                            <div class="title">银河帝国</div>
                            <div class="sub">阿西莫夫</div>
                            <div class="progress"><span style="width: 48%;"></span></div>
                            <div class="meta">缓存: 54 / 112 章</div>
                        </div>
                        <div class="more">⋯</div>
                    </div>
                    <div class="book">
                        <div class="check"></div>
                        <div class="cover"></div>
                        <div class="info">
                            <div class="title">海伯利安</div>
                            <div class="sub">丹·西蒙斯</div>
                            <div class="progress"><span style="width: 14%;"></span></div>
                            <div class="meta">缓存: 12 / 86 章</div>
                        </div>
                        <div class="more">⋯</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
