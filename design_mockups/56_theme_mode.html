<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主题模式选择 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --text: #1f2329;
            --sub: #4e5969;
            --hint: #86909c;
            --line: #e5e6eb;
            --primary: #7c3aed;
        }
        body { background: linear-gradient(135deg, #141a26, #2b2450 58%, #111827); }
        .phone-frame {
            background:
                linear-gradient(180deg, rgba(0,0,0,0.24), rgba(0,0,0,0.48)),
                linear-gradient(135deg, #efe9ff, #dbe4ff);
        }
        .dialog {
            position: absolute; left: 24px; right: 24px; top: 170px;
            border-radius: 28px; overflow: hidden; background: rgba(255,255,255,0.96);
            box-shadow: 0 24px 60px rgba(17,24,39,0.20); backdrop-filter: blur(18px);
        }
        .head { padding: 18px; border-bottom: 1px solid var(--line); }
        .title { font-size: 18px; font-weight: 800; color: var(--text); }
        .sub { margin-top: 6px; font-size: 13px; color: var(--sub); line-height: 1.6; }
        .list { padding: 14px; display: grid; gap: 10px; }
        .item {
            display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px;
            background: #f7f9fc; border: 1px solid #edf0f4;
        }
        .item.active { background: #f6f0ff; border-color: #ddd0ff; }
        .icon {
            width: 42px; height: 42px; border-radius: 16px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }
        .icon.dark { background: linear-gradient(135deg, #334155, #0f172a); }
        .icon.sys { background: linear-gradient(135deg, #60a5fa, #2563eb); }
        .info { flex: 1; }
        .name { font-size: 15px; font-weight: 800; color: var(--text); }
        .desc { margin-top: 4px; font-size: 12px; color: var(--sub); }
        .radio {
            width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c9cdd4; flex-shrink: 0;
        }
        .item.active .radio {
            border-color: var(--primary); background: var(--primary); box-shadow: inset 0 0 0 4px #fff;
        }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>主题模式选择</h1>
            <p>补充“我的”模块里的主题模式选择弹窗，统一浅色、深色和跟随系统三种模式的说明与选中反馈。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="dialog">
                    <div class="head">
                        <div class="title">选择主题模式</div>
                        <div class="sub">主题模式会立即生效，并影响阅读器与设置页的整体明暗层次。</div>
                    </div>
                    <div class="list">
                        <div class="item">
                            <div class="icon">☀</div>
                            <div class="info">
                                <div class="name">浅色</div>
                                <div class="desc">保持高亮背景与更轻的界面层次</div>
                            </div>
                            <div class="radio"></div>
                        </div>
                        <div class="item active">
                            <div class="icon dark">☾</div>
                            <div class="info">
                                <div class="name">深色</div>
                                <div class="desc">降低夜间使用时的亮度刺激</div>
                            </div>
                            <div class="radio"></div>
                        </div>
                        <div class="item">
                            <div class="icon sys">⎋</div>
                            <div class="info">
                                <div class="name">跟随系统</div>
                                <div class="desc">根据系统设定自动切换日夜主题</div>
                            </div>
                            <div class="radio"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
