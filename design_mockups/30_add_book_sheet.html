<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加书籍弹层 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #18222f, #0d1117 60%);
        }
        .phone-frame {
            width: 375px; height: 812px; border-radius: 40px; overflow: hidden; position: relative;
            background:
                linear-gradient(180deg, rgba(0,0,0,0.34), rgba(0,0,0,0.52)),
                linear-gradient(135deg, #edf3ff, #cddcff);
            box-shadow: 0 26px 60px rgba(0,0,0,0.34);
        }
        .sheet {
            position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.96);
            backdrop-filter: blur(16px); border-radius: 32px 32px 0 0; padding: 12px 16px 24px;
        }
        .handle {
            width: 42px; height: 5px; border-radius: 999px; background: #d0d7e2; margin: 0 auto 18px;
        }
        .sheet-title { font-size: 20px; font-weight: 800; color: #1f2329; margin-bottom: 6px; }
        .sheet-sub { font-size: 13px; color: #86909c; line-height: 1.5; margin-bottom: 18px; }
        .option-list { display: grid; gap: 12px; }
        .option {
            display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 22px; background: #f7f9fc; border: 1px solid #edf0f4;
        }
        .option-icon {
            width: 52px; height: 52px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #fff; flex-shrink: 0;
        }
        .o1 { background: linear-gradient(135deg, #1677ff, #69b1ff); }
        .o2 { background: linear-gradient(135deg, #fa8c16, #ffb65c); }
        .option-title { font-size: 15px; font-weight: 700; color: #1f2329; }
        .option-desc { font-size: 12px; color: #86909c; margin-top: 4px; line-height: 1.45; }
        .option-arrow { margin-left: auto; color: #b8bec8; font-size: 18px; }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>添加书籍弹层</h1>
            <p>补充“书架”模块的添加入口弹层，把在线搜索和本地导入做成两个清晰的大动作卡片。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="sheet">
                    <div class="handle"></div>
                    <div class="sheet-title">添加书籍</div>
                    <div class="sheet-sub">这个弹层只承载路径选择，不混入过多配置项，保证点击后马上进入下一步。</div>
                    <div class="option-list">
                        <div class="option">
                            <div class="option-icon o1">⌕</div>
                            <div>
                                <div class="option-title">搜索在线书籍</div>
                                <div class="option-desc">从书源里搜索作品并直接加入书架，适合第一次使用或找新书。</div>
                            </div>
                            <div class="option-arrow">›</div>
                        </div>
                        <div class="option">
                            <div class="option-icon o2">📁</div>
                            <div>
                                <div class="option-title">导入本地书籍</div>
                                <div class="option-desc">从设备文件中导入 TXT、EPUB 等内容，适合已有本地收藏的用户。</div>
                            </div>
                            <div class="option-arrow">›</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
