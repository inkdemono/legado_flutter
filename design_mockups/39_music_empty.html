<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐空态 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1b1030, #0b0f17 62%);
        }
        .phone-frame {
            width: 375px; height: 812px; border-radius: 40px; overflow: hidden; position: relative;
            background:
                radial-gradient(circle at top right, rgba(255,122,165,0.18), transparent 24%),
                linear-gradient(180deg, #fbf7ff, #f4f3f9 200px, #f6f7fb);
            box-shadow: 0 26px 60px rgba(0,0,0,0.34);
        }
        .tabs { padding: 18px 16px 12px; display: flex; gap: 8px; }
        .tab { padding: 8px 14px; border-radius: 999px; background: #ece8ff; color: #6b4dff; font-size: 12px; }
        .tab.active { background: #6b4dff; color: #fff; font-weight: 700; }
        .content {
            height: calc(100% - 44px - 60px - 82px);
            display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
        }
        .empty { max-width: 260px; }
        .hero {
            width: 132px; height: 132px; margin: 0 auto 24px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,122,165,0.14), rgba(124,92,255,0.10));
            display: flex; align-items: center; justify-content: center;
        }
        .hero span { font-size: 62px; }
        .title { font-size: 24px; font-weight: 800; color: #1f2329; }
        .desc { margin-top: 10px; font-size: 14px; line-height: 1.6; color: #86909c; }
        .btn {
            margin-top: 24px; height: 50px; border-radius: 16px; background: linear-gradient(135deg, #ff7aa5, #7c5cff); color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
        }
        .fab {
            position: absolute; right: 22px; bottom: 24px; width: 58px; height: 58px; border-radius: 29px;
            background: linear-gradient(135deg, #ff7aa5, #7c5cff); color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 28px; box-shadow: 0 14px 26px rgba(124,92,255,0.24);
        }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>音乐空态</h1>
            <p>补充“媒体”模块里音乐库无数据时的页面，让扫描本地音乐成为唯一明确动作。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="status-bar"><span>9:41</span><span>5G 100%</span></div>
                <div class="tabs">
                    <div class="tab active">歌曲</div>
                    <div class="tab">专辑</div>
                    <div class="tab">艺术家</div>
                    <div class="tab">播放列表</div>
                </div>
                <div class="content">
                    <div class="empty">
                        <div class="hero"><span>🎵</span></div>
                        <div class="title">暂无歌曲</div>
                        <div class="desc">空态比常规列表页更应该突出主动作，这里不再展示次级筛选，而是直接引导扫描本地音乐。</div>
                        <div class="btn">扫描本地音乐</div>
                    </div>
                </div>
                <div class="fab">＋</div>
            </div>
        </div>
    </div>
</body>
</html>
