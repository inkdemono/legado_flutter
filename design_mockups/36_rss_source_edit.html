<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS源编辑 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #301508, #111827 62%);
        }
        .phone-frame {
            width: 375px; height: 812px; border-radius: 40px; overflow: hidden; position: relative; background: #f6f7fb;
            box-shadow: 0 26px 60px rgba(0,0,0,0.34);
        }
        .status-bar, .app-bar { background: #fff; display: flex; align-items: center; }
        .status-bar { height: 44px; justify-content: space-between; padding: 10px 24px 0; font-size: 14px; font-weight: 600; color: #1f2329; }
        .app-bar { height: 56px; border-bottom: 1px solid #e5e6eb; padding: 0 12px; }
        .icon-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #4e5969; }
        .title { flex: 1; font-size: 18px; font-weight: 700; color: #1f2329; }
        .save { color: #ea580c; font-weight: 700; font-size: 14px; }
        .content { padding: 16px; display: grid; gap: 12px; }
        .hero {
            padding: 16px; border-radius: 22px; color: #fff;
            background: linear-gradient(135deg, #fb923c, #ea580c);
        }
        .hero h2 { font-size: 20px; margin-bottom: 6px; }
        .hero p { font-size: 12px; color: rgba(255,255,255,0.82); line-height: 1.5; }
        .field {
            padding: 14px; border-radius: 18px; background: #fff; border: 1px solid #edf0f4;
        }
        .field-label { font-size: 12px; color: #86909c; margin-bottom: 8px; }
        .field-value { font-size: 14px; color: #1f2329; }
        .field-value.muted { color: #b8bec8; }
        .switch-row {
            display: flex; align-items: center; justify-content: space-between; padding: 14px; border-radius: 18px; background: #fff;
            border: 1px solid #edf0f4;
        }
        .switch-title { font-size: 14px; font-weight: 700; color: #1f2329; }
        .switch-sub { font-size: 12px; color: #86909c; margin-top: 4px; }
        .switch {
            width: 46px; height: 28px; border-radius: 14px; background: rgba(34,197,94,0.28); position: relative;
        }
        .switch::after {
            content: ""; position: absolute; top: 3px; left: 22px; width: 22px; height: 22px; border-radius: 50%; background: #22c55e;
        }
        .delete-btn {
            margin-top: 8px; height: 48px; border-radius: 16px; background: #fff2f0; color: #e34d59; border: 1px solid #ffd8d2;
            display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700;
        }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>RSS源编辑</h1>
            <p>补充“发现”模块里的 RSS 源编辑页，聚焦 URL、名称、分组和启用状态的表单层次。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="status-bar"><span>9:41</span><span>5G 100%</span></div>
                <div class="app-bar">
                    <div class="icon-btn">‹</div>
                    <div class="title">编辑RSS源</div>
                    <div class="save">保存</div>
                </div>
                <div class="content">
                    <div class="hero">
                        <h2>少数派</h2>
                        <p>编辑页用更轻的表单容器承载，顶部只保留来源识别，不重复管理页中的批量语义。</p>
                    </div>
                    <div class="field">
                        <div class="field-label">RSS源URL *</div>
                        <div class="field-value">https://sspai.com/feed</div>
                    </div>
                    <div class="field">
                        <div class="field-label">RSS源名称 *</div>
                        <div class="field-value">少数派</div>
                    </div>
                    <div class="field">
                        <div class="field-label">分组</div>
                        <div class="field-value">科技资讯</div>
                    </div>
                    <div class="field">
                        <div class="field-label">注释</div>
                        <div class="field-value muted">高质量中文科技与效率内容</div>
                    </div>
                    <div class="switch-row">
                        <div>
                            <div class="switch-title">启用</div>
                            <div class="switch-sub">是否在订阅列表中显示并参与刷新</div>
                        </div>
                        <div class="switch"></div>
                    </div>
                    <div class="delete-btn">删除 RSS 源</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
