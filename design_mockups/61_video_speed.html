<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放速度 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --text: #1f2329;
            --sub: #4e5969;
            --hint: #86909c;
            --primary: #0ea5e9;
        }
        body { background: linear-gradient(135deg, #101821, #233b56 58%, #0f172a); }
        .phone-frame {
            background:
                linear-gradient(180deg, rgba(0,0,0,0.30), rgba(0,0,0,0.56)),
                linear-gradient(135deg, #dff4ff, #e2e8ff);
        }
        .sheet {
            position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 26px;
            border-radius: 32px 32px 0 0; background: rgba(255,255,255,0.96); backdrop-filter: blur(16px);
        }
        .handle { width: 42px; height: 5px; border-radius: 999px; background: #d0d7e2; margin: 0 auto 18px; }
        .title { font-size: 20px; font-weight: 800; color: var(--text); }
        .grid {
            margin-top: 22px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }
        .chip {
            height: 50px; border-radius: 18px; background: #f7f9fc; border: 1px solid #edf0f4;
            display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--sub);
        }
        .chip.active { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: #fff; border-color: transparent; }
        .hint { margin-top: 16px; font-size: 12px; color: var(--hint); line-height: 1.6; }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>视频播放速度</h1>
            <p>补充“媒体”模块视频播放器里的倍速弹层，采用离散选项强化单手快速切换的控制效率。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="sheet">
                    <div class="handle"></div>
                    <div class="title">播放速度</div>
                    <div class="grid">
                        <div class="chip">0.5x</div>
                        <div class="chip">0.75x</div>
                        <div class="chip active">1.0x</div>
                        <div class="chip">1.25x</div>
                        <div class="chip">1.5x</div>
                        <div class="chip">1.75x</div>
                        <div class="chip">2.0x</div>
                    </div>
                    <div class="hint">视频倍速更适合使用离散按钮而不是连续滑杆，这样切换时反馈更确定，也更符合播放器操作习惯。</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
