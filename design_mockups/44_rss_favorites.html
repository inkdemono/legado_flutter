<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS收藏 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f7f8fc;
            --card: #ffffff;
            --text: #1f2329;
            --sub: #4e5969;
            --hint: #86909c;
            --line: #e5e6eb;
            --primary: #f59e0b;
            --accent: #fb923c;
        }
        body { background: linear-gradient(135deg, #23160a, #15202d 62%); }
        .phone-frame {
            background:
                radial-gradient(circle at top right, rgba(245,158,11,0.12), transparent 28%),
                linear-gradient(180deg, #fcfcfe, var(--bg));
        }
        .status-bar, .app-bar { display: flex; align-items: center; background: rgba(255,255,255,0.94); }
        .status-bar {
            height: 44px; justify-content: space-between; padding: 10px 24px 0;
            font-size: 14px; font-weight: 600; color: var(--text);
        }
        .app-bar {
            height: 56px; padding: 0 12px; border-bottom: 1px solid var(--line);
        }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text);
        }
        .app-bar-title { flex: 1; font-size: 18px; font-weight: 700; color: var(--text); }
        .toolbar {
            padding: 12px 16px 10px; background: rgba(255,255,255,0.92); border-bottom: 1px solid var(--line);
        }
        .search-box {
            height: 44px; border-radius: 16px; background: #f7f8fa; border: 1px solid #edf0f4;
            display: flex; align-items: center; justify-content: space-between; padding: 0 14px; color: var(--hint); font-size: 14px;
        }
        .chips {
            display: flex; gap: 8px; overflow-x: auto; padding-top: 10px;
        }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            padding: 7px 12px; border-radius: 999px; background: #f2f3f5; white-space: nowrap; font-size: 12px; color: var(--sub);
        }
        .chip.active { background: #fff4de; color: #c77a00; font-weight: 700; }
        .content-area {
            height: calc(100% - 44px - 56px - 98px);
            overflow-y: auto; padding: 12px 16px 20px;
        }
        .fav-card {
            display: flex; gap: 12px; padding: 12px; margin-bottom: 10px; border-radius: 22px;
            background: var(--card); box-shadow: 0 8px 24px rgba(15,23,32,0.05);
        }
        .thumb {
            width: 72px; height: 72px; border-radius: 18px; flex-shrink: 0;
            background: linear-gradient(135deg, #fdba74, #ea580c);
        }
        .thumb.alt { background: linear-gradient(135deg, #60a5fa, #2563eb); }
        .thumb.gray { background: linear-gradient(135deg, #cbd5e1, #64748b); }
        .fav-info { flex: 1; min-width: 0; }
        .fav-title {
            font-size: 15px; font-weight: 800; color: var(--text); line-height: 1.45;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .fav-meta { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
        .meta {
            padding: 4px 8px; border-radius: 999px; background: #f2f3f5; font-size: 11px; color: var(--hint);
        }
        .meta.group { background: #eef6ff; color: #165dff; }
        .fav-time { margin-top: 8px; font-size: 12px; color: var(--sub); }
        .delete {
            width: 34px; height: 34px; border-radius: 17px; background: #fff4f2; color: #f53f3f;
            display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
        }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>RSS收藏</h1>
            <p>补充“发现”模块里的 RSS 收藏页，整合搜索、分组筛选、卡片化文章信息和快速删除动作。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="status-bar"><span>9:41</span><span>5G 100%</span></div>
                <div class="app-bar">
                    <div class="icon-btn">‹</div>
                    <div class="app-bar-title">收藏</div>
                    <div class="icon-btn">⛃</div>
                </div>
                <div class="toolbar">
                    <div class="search-box">
                        <span>⌕ 搜索收藏</span>
                        <span>✕</span>
                    </div>
                    <div class="chips">
                        <div class="chip active">全部分组</div>
                        <div class="chip">产品观察</div>
                        <div class="chip">工作流</div>
                        <div class="chip">技术</div>
                    </div>
                </div>
                <div class="content-area">
                    <div class="fav-card">
                        <div class="thumb"></div>
                        <div class="fav-info">
                            <div class="fav-title">把阅读器当作第二信息流后，我重新整理了移动端收藏体系</div>
                            <div class="fav-meta">
                                <span class="meta group">工作流</span>
                                <span class="meta">少数派</span>
                            </div>
                            <div class="fav-time">2026-03-28 08:25</div>
                        </div>
                        <div class="delete">🗑</div>
                    </div>

                    <div class="fav-card">
                        <div class="thumb alt"></div>
                        <div class="fav-info">
                            <div class="fav-title">RSS 订阅清单怎样维护，才不会在半年后重新沦为信息垃圾站</div>
                            <div class="fav-meta">
                                <span class="meta group">产品观察</span>
                                <span class="meta">长文</span>
                            </div>
                            <div class="fav-time">2026-03-27 21:40</div>
                        </div>
                        <div class="delete">🗑</div>
                    </div>

                    <div class="fav-card">
                        <div class="thumb gray"></div>
                        <div class="fav-info">
                            <div class="fav-title">阅读记录、收藏与刷新入口，是否应该在文章列表页同时存在</div>
                            <div class="fav-meta">
                                <span class="meta group">默认分组</span>
                                <span class="meta">讨论</span>
                            </div>
                            <div class="fav-time">2026-03-26 12:12</div>
                        </div>
                        <div class="delete">🗑</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
