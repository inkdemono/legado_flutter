<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放速度 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --text: #1f2329;
            --sub: #4e5969;
            --hint: #86909c;
            --primary: #ff7aa5;
        }
        body { background: linear-gradient(135deg, #151425, #3b2554 58%, #101827); }
        .phone-frame {
            background:
                linear-gradient(180deg, rgba(0,0,0,0.28), rgba(0,0,0,0.52)),
                linear-gradient(135deg, #ffe3ef, #e6ddff);
        }
        .sheet {
            position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 26px;
            border-radius: 32px 32px 0 0; background: rgba(255,255,255,0.96); backdrop-filter: blur(16px);
        }
        .handle { width: 42px; height: 5px; border-radius: 999px; background: #d0d7e2; margin: 0 auto 18px; }
        .title { font-size: 20px; font-weight: 800; color: var(--text); }
        .row { margin-top: 20px; display: flex; align-items: center; gap: 16px; }
        .speed {
            min-width: 64px; font-size: 26px; font-weight: 800; color: var(--text);
        }
        .slider {
            flex: 1; height: 8px; border-radius: 999px; background: #f2d5e1; position: relative;
        }
        .slider::before {
            content: ""; position: absolute; left: 0; top: 0; width: 56%; height: 100%; border-radius: inherit;
            background: linear-gradient(90deg, #ff7aa5, #7c5cff);
        }
        .slider::after {
            content: ""; position: absolute; left: calc(56% - 12px); top: 50%; width: 24px; height: 24px; transform: translateY(-50%);
            border-radius: 50%; background: #fff; box-shadow: 0 6px 18px rgba(124,92,255,0.26);
        }
        .marks {
            margin-top: 16px; display: flex; justify-content: space-between; font-size: 11px; color: var(--hint);
        }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>音乐播放速度</h1>
            <p>补充“媒体”模块音乐播放器里的播放速度弹层，突出实时倍速数值和滑杆调节关系。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="sheet">
                    <div class="handle"></div>
                    <div class="title">播放速度</div>
                    <div class="row">
                        <div class="speed">1.3x</div>
                        <div class="slider"></div>
                    </div>
                    <div class="marks">
                        <span>0.5x</span>
                        <span>1.0x</span>
                        <span>1.5x</span>
                        <span>2.0x</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
