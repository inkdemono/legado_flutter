<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑书籍信息 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #f6f8fb;
            --card: #fff;
            --text: #1f2329;
            --sub: #4e5969;
            --hint: #86909c;
            --line: #e5e6eb;
            --primary: #1677ff;
        }
        body { background: linear-gradient(135deg, #111b25, #18314f 60%, #0f172a); }
        .phone-frame {
            background:
                radial-gradient(circle at top, rgba(22,119,255,0.10), transparent 30%),
                linear-gradient(180deg, #fbfdff, var(--bg));
        }
        .status-bar, .app-bar { display: flex; align-items: center; background: rgba(255,255,255,0.95); }
        .status-bar {
            height: 44px; justify-content: space-between; padding: 10px 24px 0;
            font-size: 14px; font-weight: 600; color: var(--text);
        }
        .app-bar {
            height: 56px; padding: 0 12px; border-bottom: 1px solid var(--line);
        }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text);
        }
        .app-bar-title { flex: 1; font-size: 18px; font-weight: 700; color: var(--text); }
        .content-area {
            height: calc(100% - 44px - 56px); overflow-y: auto; padding: 16px 16px 26px;
        }
        .section { margin-bottom: 18px; }
        .label { font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 10px; }
        .segmented {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
        }
        .seg {
            height: 44px; border-radius: 14px; background: #f2f3f5; color: var(--sub);
            display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
        }
        .seg.active { background: #eef4ff; color: var(--primary); }
        .field {
            min-height: 48px; border-radius: 16px; border: 1px solid #e5e6eb; background: #fff;
            display: flex; align-items: center; padding: 0 14px; font-size: 14px; color: var(--text);
        }
        .field.textarea {
            min-height: 156px; align-items: flex-start; padding: 14px; line-height: 1.7; color: var(--sub);
        }
        .save {
            margin-top: 22px; height: 52px; border-radius: 18px; background: linear-gradient(135deg, #1677ff, #69b1ff);
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; font-weight: 800;
        }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>编辑书籍信息</h1>
            <p>补充“书架”模块里的书籍编辑页，统一书籍类型、书名作者、封面 URL 和简介这组元信息编辑表单。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="status-bar"><span>9:41</span><span>5G 100%</span></div>
                <div class="app-bar">
                    <div class="icon-btn">‹</div>
                    <div class="app-bar-title">编辑书籍信息</div>
                    <div class="icon-btn">✓</div>
                </div>
                <div class="content-area">
                    <div class="section">
                        <div class="label">书籍类型</div>
                        <div class="segmented">
                            <div class="seg active">📖 文本</div>
                            <div class="seg">🎧 音频</div>
                            <div class="seg">🖼 图片</div>
                        </div>
                    </div>
                    <div class="section">
                        <div class="label">书名</div>
                        <div class="field">三体</div>
                    </div>
                    <div class="section">
                        <div class="label">作者</div>
                        <div class="field">刘慈欣</div>
                    </div>
                    <div class="section">
                        <div class="label">封面 URL</div>
                        <div class="field">https://img.example.com/santi-cover.jpg</div>
                    </div>
                    <div class="section">
                        <div class="label">简介</div>
                        <div class="field textarea">文化大革命如火如荼进行的同时，军方探寻外星文明的绝秘计划取得了突破性进展。后续编辑态延续长文本输入的沉浸阅读感，而不是做成典型后台表单的冷感布局。</div>
                    </div>
                    <div class="save">保存</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
