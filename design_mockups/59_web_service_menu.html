<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 服务菜单 - Legado Flutter UI设计稿</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --text: #1f2329;
            --sub: #4e5969;
            --hint: #86909c;
            --primary: #16a34a;
        }
        body { background: linear-gradient(135deg, #111924, #1e2f3c 58%, #0f172a); }
        .phone-frame {
            background:
                linear-gradient(180deg, rgba(0,0,0,0.22), rgba(0,0,0,0.48)),
                linear-gradient(135deg, #eefbf3, #e3f2ff);
        }
        .sheet {
            position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 24px;
            border-radius: 32px 32px 0 0; background: rgba(255,255,255,0.96); backdrop-filter: blur(16px);
        }
        .handle { width: 42px; height: 5px; border-radius: 999px; background: #d0d7e2; margin: 0 auto 18px; }
        .title { font-size: 20px; font-weight: 800; color: var(--text); }
        .sub { margin-top: 6px; font-size: 13px; color: var(--hint); line-height: 1.6; }
        .address {
            margin-top: 18px; padding: 12px 14px; border-radius: 18px; background: #eefbf3; color: var(--primary);
            font-size: 12px; font-weight: 700; line-height: 1.6;
        }
        .list { margin-top: 14px; display: grid; gap: 10px; }
        .item {
            display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px;
            background: #f7f9fc; border: 1px solid #edf0f4;
        }
        .icon {
            width: 42px; height: 42px; border-radius: 16px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px;
            background: linear-gradient(135deg, #16a34a, #22c55e);
        }
        .icon.blue { background: linear-gradient(135deg, #1677ff, #69b1ff); }
        .info { flex: 1; }
        .name { font-size: 15px; font-weight: 800; color: var(--text); }
        .desc { margin-top: 4px; font-size: 12px; color: var(--sub); }
        .arrow { color: #b8bec8; font-size: 18px; }
    </style>
    <link rel="stylesheet" href="design_system.css">
</head>
<body>
    <div class="design-container">
        <div class="design-header">
            <h1>Web 服务菜单</h1>
            <p>补充“我的”模块 Web 服务已启动时的底部菜单，承接地址复制与浏览器打开这两个高频动作。</p>
        </div>
        <div class="phones-container">
            <div class="phone-frame">
                <div class="sheet">
                    <div class="handle"></div>
                    <div class="title">Web 服务</div>
                    <div class="sub">当前设备局域网地址已可访问，可用于跨端打开网页管理页。</div>
                    <div class="address">http://192.168.31.24:8080</div>
                    <div class="list">
                        <div class="item">
                            <div class="icon">⧉</div>
                            <div class="info">
                                <div class="name">复制地址</div>
                                <div class="desc">复制当前服务地址到剪贴板，便于分享或跨设备访问</div>
                            </div>
                            <div class="arrow">›</div>
                        </div>
                        <div class="item">
                            <div class="icon blue">↗</div>
                            <div class="info">
                                <div class="name">浏览器打开</div>
                                <div class="desc">直接在系统浏览器中访问当前服务页面</div>
                            </div>
                            <div class="arrow">›</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
